name: Sync SR Unlock Modules (deezertidal)

on:
  schedule:
    # 每天 20:30 UTC = 北京 04:30，与主模块同步错开
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deezertidal rules
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 --max-time 180 \
                 -o /tmp/dz.zip \
                 "https://github.com/deezertidal/shadowrocket-rules/archive/refs/heads/master.zip"; then
              break
            fi
            echo "retry $i"; sleep 15
          done
          test -s /tmp/dz.zip
          unzip -q -o /tmp/dz.zip -d /tmp/dz
          ls -d /tmp/dz/*/modules

      - name: Convert - unlock（解锁/破解）
        working-directory: sr-adblock
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/sr-adblock
        run: |
          set -euo pipefail
          MODS=$(ls -d /tmp/dz/*/modules)
          python3 tools/dz_convert.py "$MODS" dist/unlock.srmodule \
            --filter unlock --raw-url "$RAW/dist/unlock.srmodule" \
            --report build/dz_unlock.json
          python3 tools/dz_check.py --module dist/unlock.srmodule \
            --min-rule 0 --min-urw 0 --min-script 100 --min-mitm 100
          python3 tools/health_check.py --module dist/unlock.srmodule --network --sample 5

      - name: Build all-in-one（去广告 + 解锁合并）
        working-directory: sr-adblock
        env:
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/sr-adblock
        run: |
          set -euo pipefail
          if [ -f dist/blockAds.sr.module ]; then
            python3 tools/make_allinone.py \
              --ad dist/blockAds.sr.module --unlock dist/unlock.srmodule \
              --out dist/all-in-one.srmodule \
              --raw-url "$RAW/dist/all-in-one.srmodule" \
              --report build/allinone.json
            python3 tools/health_check.py --module dist/all-in-one.srmodule || true
          else
            echo "::warning::dist/blockAds.sr.module 不存在，本次跳过 all-in-one"
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '自动同步失败：deezertidal 解锁模块';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'auto-sync', per_page: 10
            });
            const body = [
              `运行: ${context.runId}`,
              `链接: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '本次**未提交任何文件**，线上产物保持上一版。'
            ].join('\n');
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['auto-sync']
              });
            }

      - name: Commit & push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sr-adblock/dist sr-adblock/build
          if git diff --staged --quiet; then echo "上游无变化"; exit 0; fi
          U=$(python3 -c "import json;d=json.load(open('sr-adblock/build/dz_unlock.json'));print(d['script'],d['mitm'])")
          git commit -m "chore: sync deezertidal unlock $(date -u +%Y-%m-%d)" \
            -m "解锁: 脚本 ${U%% *} / MITM ${U##* }"
          git push
